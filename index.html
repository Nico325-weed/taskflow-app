<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - TechNova</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>TaskFlow</h1>
    <p>Gestión de tareas para equipos</p>
  </header>

  <main>
    <p>Bienvenido a TaskFlow.</p>

    <!-- Sección Dashboard -->
    <section id="dashboard">
      <h2>Dashboard</h2>
      <div class="stats">
        <div class="stat-card">
          <h3>Tareas Totales</h3>
          <p class="stat-number">24</p>
        </div>
        <div class="stat-card">
          <h3>En Progreso</h3>
          <p class="stat-number">8</p>
        </div>
        <div class="stat-card">
          <h3>Completadas</h3>
          <p class="stat-number">12</p>
        </div>
        <div class="stat-card">
          <h3>Pendientes</h3>
          <p class="stat-number">4</p>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
